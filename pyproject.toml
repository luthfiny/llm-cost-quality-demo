[project]
name = "llm-cost-quality-demo"
version = "0.1.0"
description = "A support chatbot with cost-aware model routing, per-route cost accounting, tracing and a deterministic eval harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luthfi Naufan Yamin" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4.0"]

[project.scripts]
lcq = "lcq.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
